name: Terminal Shift 229 TEST macOS ARM64 DMG
on:
  push:
    branches: [test/terminal-shift-229-macos-arm64-20261104]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: terminal-shift-test-dmg-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dmg:
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Verify public fork and standard Intel runner
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          test "$GITHUB_REPOSITORY" = NingYuanLin/openidea
          test "$REPOSITORY_PRIVATE" = false
          test "$(uname -m)" = x86_64
          uname -m
          sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-darwin }
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-intel-host-aarch64-apple-darwin
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Validate terminal regression and types
        run: |
          pnpm typecheck
          pnpm exec tsc --noEmit -p e2e/tsconfig.json
          pnpm exec vitest run src/features/terminal
          pnpm exec playwright install chromium webkit
          pnpm exec playwright test --config playwright.terminal.config.ts
      - name: Build ad-hoc signed test DMG
        run: >-
          pnpm tauri build --target aarch64-apple-darwin --bundles dmg
          --config src-tauri/tauri.shift-test.conf.json
      - name: Check generated source files
        run: git diff --exit-code
      - name: Verify ARM64 app and DMG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-artifacts
          cp target/aarch64-apple-darwin/release/bundle/dmg/*.dmg test-artifacts/
          mountpoint="$RUNNER_TEMP/openidea-dmg-verify"
          mkdir -p "$mountpoint"
          for dmg in test-artifacts/*.dmg; do
            hdiutil verify "$dmg"
            hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mountpoint"
            trap 'hdiutil detach "$mountpoint" || true' EXIT
            app="$mountpoint/OpenIDEA Shift TEST.app"
            file "$app/Contents/MacOS/openidea"
            test "$(lipo -archs "$app/Contents/MacOS/openidea")" = arm64
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dvv "$app" 2>&1 | tee test-artifacts/SIGNATURE.txt
            grep -q 'Signature=adhoc' test-artifacts/SIGNATURE.txt
            hdiutil detach "$mountpoint"
            trap - EXIT
          done
          cd test-artifacts
          shasum -a 256 *.dmg | tee SHA256SUMS.txt
          printf 'Build commit: %s\nTest profile: opt-level=1, lto=false, codegen-units=16\nAd-hoc signed, not notarized. Narrow public-API Shift 229 workaround on upstream 62b5f11a; stock xterm 6.0.0. Native IME evidence not simulated by automated tests.\n' "$GITHUB_SHA" > COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OpenIDEA-Shift-TEST-macOS-ARM64
          path: test-artifacts/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: terminal-shift-test-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
